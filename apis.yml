aid: discover-financial
name: Discover Financial Services
kind: company
description: >-
  Discover Financial Services is a US direct bank and payments company that owns
  the Discover Network, the PULSE debit network, and Diners Club International.
  Its Discover Global Network (DGN) developer program exposes a partner-gated
  developer center with interactive OpenAPI documentation for card-network
  products — EMV 3-D Secure (ProtectBuy), Secure Remote Commerce / Click to Pay,
  Stored Token Services (tokenization), and Discover Deliver push payments.
  Consumer account-data access is delivered through open-finance aggregators
  (Plaid, Finicity) rather than a first-party retail-banking API.
