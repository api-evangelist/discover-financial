apis:
  - aid: discover-financial:protectbuy-3ds
    name: Discover ProtectBuy 3-D Secure API
    description: >-
      ProtectBuy is Discover Global Network's EMV 3-D Secure (3DS) cardholder
      authentication service. Built on the EMVCo 3-D Secure protocol, it lets
      merchants, acquirers, and 3DS servers authenticate Discover, Diners Club,
      and network-alliance cardholders at checkout, challenge high-risk
      transactions with a one-time password, and shift liability for
      card-not-present fraud across web, mobile, and connected-device commerce.
      Documentation and OpenAPI reference are published in the partner-gated
      Discover Developer Center; full specs require partner authentication.
    humanURL: https://www.discoverglobalnetwork.com/solutions/fraud-security/protectbuy/
    tags:
      - 3D Secure
      - Fraud
      - Authentication
      - Payments
      - United States
    tags_raw:
      - 3-D Secure
      - Fraud
      - Authentication
      - Payments
      - United States
    properties:
      - type: DeveloperPortal
        url: https://developer.discover.com/
      - type: Documentation
        url: https://www.discoverglobalnetwork.com/solutions/fraud-security/protectbuy/
  - aid: discover-financial:secure-remote-commerce
    name: Discover Secure Remote Commerce (Click to Pay) API
    description: >-
      Discover's Secure Remote Commerce (SRC) implementation powers Click to Pay,
      the EMVCo standard for a streamlined, tokenized online checkout across
      participating card networks. The SRC developer program exposes enrollment,
      recognition, and checkout operations so merchants and payment providers can
      offer a consistent guest and returning-cardholder experience without
      handling raw PANs. A dedicated SRC developer console and interactive
      OpenAPI reference are available behind partner sign-in on the Discover
      Developer Center.
    humanURL: https://www.discoverglobalnetwork.com/solutions/enable-payments/secure-remote-commerce/
    tags:
      - Secure Remote Commerce
      - Click to Pay
      - Checkout
      - Payments
      - United States
    properties:
      - type: DeveloperPortal
        url: https://console.src.developer.discover.com/
      - type: Documentation
        url: https://www.discoverglobalnetwork.com/solutions/enable-payments/secure-remote-commerce/
  - aid: discover-financial:stored-token-services
    name: Discover Stored Token Services API
    description: >-
      Stored Token Services is Discover Global Network's payment tokenization
      service. It replaces sensitive card account numbers with network tokens for
      card-on-file, digital-wallet, and recurring-payment use cases, and manages
      the token lifecycle — provisioning, updates, and suspension — so merchants
      and token requestors can secure every digital transaction and reduce the
      scope of stored credential data. The API is documented with interactive
      OpenAPI reference in the partner-gated Discover Developer Center.
    humanURL: https://www.discoverglobalnetwork.com/solutions/fraud-security/stored-token-services/
    tags:
      - Tokenization
      - Card on File
      - Security
      - Payments
      - United States
    properties:
      - type: DeveloperPortal
        url: https://developer.discover.com/
      - type: Documentation
        url: https://www.discoverglobalnetwork.com/solutions/fraud-security/stored-token-services/
  - aid: discover-financial:discover-deliver-push-payments
    name: Discover Deliver Push Payments API
    description: >-
      Discover Deliver is Discover Global Network's push-payments (Original Credit
      Transaction) service, enabling the quick, convenient, and secure transfer of
      funds directly to eligible Discover, Diners Club, and alliance-network cards.
      It supports disbursement use cases such as gig-economy payouts, refunds,
      account-to-account transfers, and insurance or lending disbursements. The
      push-payments API is documented in the partner-gated Discover Developer
      Center; production access is arranged through a Discover account executive.
    humanURL: https://www.discoverglobalnetwork.com/solutions/enable-payments/discover-deliver-push-payments-solution/
    tags:
      - Push Payments
      - Disbursements
      - OCT
      - Payments
      - United States
    properties:
